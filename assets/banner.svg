<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Wave Elements (Background Layer) -->
  <g opacity="0.25">
    <path d="M 0,160 Q 300,80 600,160 T 1200,160 L 1200,320 L 0,320 Z" fill="#0284c7">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0,160 Q 300,80 600,160 T 1200,160 L 1200,320 L 0,320 Z;
                M 0,180 Q 300,240 600,140 T 1200,180 L 1200,320 L 0,320 Z;
                M 0,160 Q 300,80 600,160 T 1200,160 L 1200,320 L 0,320 Z"/>
    </path>
    <path d="M 0,200 Q 400,280 800,180 T 1200,220 L 1200,320 L 0,320 Z" fill="#6366f1">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0,200 Q 400,280 800,180 T 1200,220 L 1200,320 L 0,320 Z;
                M 0,150 Q 400,100 800,220 T 1200,170 L 1200,320 L 0,320 Z;
                M 0,200 Q 400,280 800,180 T 1200,220 L 1200,320 L 0,320 Z"/>
    </path>
  </g>

  <!-- Grid Pattern Overlay for Tech feel -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Animated Shield Pulse (Background/Side Element) -->
  <g transform="translate(1020, 160)" opacity="0.8">
    <circle r="70" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="60;90;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Shield Icon -->
    <path d="M 0,-45 L 35,-25 L 35,15 C 35,40 0,55 0,55 C 0,55 -35,40 -35,15 L -35,-25 Z" fill="none" stroke="url(#titleGrad)" stroke-width="4" filter="url(#glow)"/>
    <path d="M -12,-5 L -2,12 L 15,-15" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Text and Content (Unobstructed & Perfectly Readable) -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 50)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">🔒 ZERO TRUST SECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome ZTNA Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Curated SaaS Platforms, Identity-Aware Proxies &amp; Self-Hosted Open-Source ZTNA Solutions</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="170" height="32" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#475569"/>
      <text x="85" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Microsegmentation</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="180" height="32" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#475569"/>
      <text x="270" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔑 Identity-Aware Access</text>

      <!-- Tag 3 -->
      <rect x="370" y="0" width="160" height="32" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#475569"/>
      <text x="450" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Software Perimeter</text>
    </g>
  </g>
</svg>
